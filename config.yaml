detection:
  detection_area:
  - 140
  - 190
  - 360
  - 220
  kernel_size: 3
  blur:
    kernel: 5
    sigma_x: 2
    sigma_y: 2
  circle:
    min_radius: 30
    max_radius: 75
    min_area_factor: 0.2
  stability:
    threshold: 15
    max_pixel_move: 10
    color_stable_threshold: 5
  timeout_ms: 100
placement:
  model_path: /home/xu/Engineer/tiny_digit_cnn_3class.pth
  gripper_fixed: min
  gripper_fixed_mm: 40
  debug: true
  show_debug: true
  digit_crop_ratio: 0.7
  min_ring_radius: 20
  min_ring_area: 350
  ring_circularity: 0.6
  min_digit_confidence: 0.6
  ring_group_overlap: 0.8
  morph_kernel_size: 5
  min_crop_px: 12
  record_placement_order: true
  placement_order_log: /home/xu/Engineer/placement_order.log
  place_stable_threshold: 30
  place_stable_max_pixel_move: 6
  tray_phase_enabled: true
  tray_phase_order: reverse
  tray_phase_action: 1
  tray_phase_skip_last_of_round: true
  # 托盘阶段 arrived 处理：edge=逐托盘等 0→1 上升沿（代码默认）；
  # 下位机在 capture=1 时把 arrived 置 0、动作结束（capture=0）后置 1，
  # 因此每个托盘/动作结束都会产生 0→1 上升沿，用 edge 即可。
  # none=不等待 arrived，进入即抓、抓完立即下一个（仅在无上升沿时用）
  tray_phase_arrived_mode: edge
  tray_gripper_fixed: 30
